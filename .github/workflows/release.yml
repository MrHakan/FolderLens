name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "installer/**"
      - "FolderLens.spec"
      - "release_manifest.py"
      - "version.py"
      - "make_version_info.py"
      - "updater.py"
      - "file_actions.py"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release (e.g. v3.0.0); leave empty for a build-only run"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release tag matches application version
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $appVersion = python -c "from version import VERSION; print(VERSION)"
          if ($env:RELEASE_TAG -ne "v$appVersion") {
            throw "Release tag $env:RELEASE_TAG does not match version.py ($appVersion)"
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest tests -v

      - name: Generate Windows version resource
        run: python make_version_info.py

      - name: Build one-file executable (no UPX, embedded metadata + manifest)
        run: pyinstaller --noconfirm FolderLens.spec

      - name: Smoke test executable
        shell: pwsh
        run: |
          if (-not (Test-Path dist\FolderLens.exe)) { throw "FolderLens.exe was not built" }
          $p = Start-Process -FilePath dist\FolderLens.exe -ArgumentList '--version' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }
          $expectedResource = python -c "from make_version_info import _version_tuple; from version import VERSION; print('.'.join(map(str, _version_tuple(VERSION))))"
          $resourceVersion = (Get-Item dist\FolderLens.exe).VersionInfo.ProductVersion
          if ($resourceVersion -ne $expectedResource) {
            throw "Executable version $resourceVersion does not match $expectedResource"
          }

      - name: Verify staged update and rollback
        run: python tests/windows_update_swap_smoke.py dist/FolderLens.exe

      - name: Verify update from the published v3.4.0 executable
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $legacy = Join-Path $env:RUNNER_TEMP 'FolderLens-v3.4.0.exe'
          Invoke-WebRequest -Uri 'https://github.com/MrHakan/FolderLens/releases/download/v3.4.0/FolderLens.exe' -OutFile $legacy
          if (-not (Test-Path $legacy)) { throw 'Could not fetch the published v3.4.0 executable' }
          python tests/windows_update_swap_smoke.py dist/FolderLens.exe $legacy
          if ($LASTEXITCODE -ne 0) { throw "Legacy update smoke test failed: $LASTEXITCODE" }

      - name: Build versioned Inno Setup installer
        run: python installer/build_installer.py

      - name: Install, run, and uninstall the package
        shell: pwsh
        run: |
          $version = python -c "from version import VERSION; print(VERSION)"
          $installerItem = Get-ChildItem "installer_output\FolderLens_Setup_$version.exe" -ErrorAction SilentlyContinue
          if (-not $installerItem) { throw "Installer asset is missing for version $version" }
          $installer = $installerItem.FullName
          $installDir = Join-Path $env:RUNNER_TEMP 'FolderLensInstall'
          $setupLog = Join-Path $env:RUNNER_TEMP 'FolderLens-setup.log'
          $installArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/TASKS=contextmenu', "/DIR=$installDir", "/LOG=$setupLog")
          $installProcess = Start-Process -FilePath $installer -ArgumentList $installArgs -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { throw "Installer exited with $($installProcess.ExitCode)" }
          $installedExe = Join-Path $installDir 'FolderLens.exe'
          if (-not (Test-Path $installedExe)) {
            Write-Host "Installed executable missing from $installDir. Setup log:"
            if (Test-Path $setupLog) { Get-Content $setupLog -Tail 100 }
            if (Test-Path $installDir) { Get-ChildItem $installDir -Force | Format-Table FullName, Length }
            $actualInstall = Get-ItemProperty 'HKLM:\SOFTWARE\FolderLens' -ErrorAction SilentlyContinue
            if ($actualInstall) { Write-Host "Registered install path: $($actualInstall.InstallPath)" }
            throw 'Installed executable is missing'
          }
          $expectedResource = python -c "from make_version_info import _version_tuple; from version import VERSION; print('.'.join(map(str, _version_tuple(VERSION))))"
          $installedResourceVersion = (Get-Item $installedExe).VersionInfo.ProductVersion
          if ($installedResourceVersion -ne $expectedResource) {
            throw "Installed executable version '$installedResourceVersion' does not match '$expectedResource'"
          }
          $versionSmoke = Start-Process -FilePath $installedExe -ArgumentList '--version' -Wait -PassThru
          if ($versionSmoke.ExitCode -ne 0) {
            throw "Installed executable --version smoke test failed: $($versionSmoke.ExitCode)"
          }
          $registry = Get-ItemProperty 'HKLM:\SOFTWARE\FolderLens'
          if ($registry.Version -ne $version -or $registry.InstallPath -ne $installDir) {
            throw 'Installer registry metadata does not match the installed package'
          }
          $backgroundCommandPath = 'Registry::HKEY_CLASSES_ROOT\Directory\Background\shell\FolderLens\command'
          $folderCommandPath = 'Registry::HKEY_CLASSES_ROOT\Directory\shell\FolderLens\command'
          if (-not (Test-Path $backgroundCommandPath) -or -not (Test-Path $folderCommandPath)) {
            throw 'Explorer context-menu commands were not installed'
          }
          $backgroundCommand = (Get-Item -LiteralPath $backgroundCommandPath).GetValue('')
          $folderCommand = (Get-Item -LiteralPath $folderCommandPath).GetValue('')
          if ($backgroundCommand -notlike "*$installedExe*" -or $backgroundCommand -notlike '*%V*' -or
              $folderCommand -notlike "*$installedExe*" -or $folderCommand -notlike '*%1*') {
            throw 'Explorer context-menu commands do not target FolderLens'
          }
          $uninstaller = Get-ChildItem $installDir -Filter 'unins*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'Uninstaller executable is missing' }
          $uninstallerPath = $uninstaller.FullName
          $uninstallLog = Join-Path $env:RUNNER_TEMP 'FolderLens-uninstall.log'
          & $uninstallerPath /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/LOG=$uninstallLog"
          if ($LASTEXITCODE -ne 0) { throw "Uninstaller exited with $LASTEXITCODE" }
          $deleteDeadline = (Get-Date).AddSeconds(10)
          while ((Test-Path $installedExe) -and (Get-Date) -lt $deleteDeadline) {
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path $installedExe) {
            Write-Host "Uninstaller log ($uninstallLog):"
            if (Test-Path $uninstallLog) { Get-Content $uninstallLog -Tail 100 }
            $appProcesses = @(Get-CimInstance Win32_Process -Filter "Name = 'FolderLens.exe'" |
              Where-Object { $_.ExecutablePath -eq $installedExe })
            if ($appProcesses.Count -gt 0) {
              Write-Host 'FolderLens processes still using the installed executable:'
              $appProcesses | Format-Table ProcessId, ExecutablePath
            }
            Get-Item $installedExe | Format-List FullName, Length, Attributes, LastWriteTimeUtc
            throw 'Uninstall left FolderLens.exe behind'
          }
          if ((Test-Path $backgroundCommandPath) -or (Test-Path $folderCommandPath)) {
            throw 'Uninstall left Explorer context-menu entries behind'
          }
          if (Test-Path 'HKLM:\SOFTWARE\FolderLens') { throw 'Uninstall left FolderLens registry metadata behind' }

      - name: Build one-directory variant (antivirus-friendly)
        shell: pwsh
        env:
          FL_ONEDIR: "1"
        run: pyinstaller --noconfirm --distpath dist_onedir FolderLens.spec

      - name: Smoke test one-directory executable
        shell: pwsh
        run: |
          $exe = 'dist_onedir\FolderLens\FolderLens.exe'
          if (-not (Test-Path $exe)) { throw 'One-directory executable is missing' }
          $p = Start-Process -FilePath $exe -ArgumentList '--version' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "One-directory smoke test failed: $($p.ExitCode)" }

      - name: Package one-directory variant as zip
        shell: pwsh
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { "${{ github.ref_name }}" }
          $ver = $tag -replace '^v', ''
          # a build-only dispatch runs on a branch, whose name can contain '/'
          # and other characters that are not legal in a file name
          $ver = $ver -replace '[^0-9A-Za-z._-]', '-'
          if (-not $ver) { $ver = "dev" }
          Compress-Archive -Path dist_onedir\FolderLens\* -DestinationPath "FolderLens-$ver-win64.zip" -Force
          Get-ChildItem FolderLens-*.zip
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Hash published assets
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem 'FolderLens-*-win64.zip')
          if ($archives.Count -ne 1) { throw "Expected one archive, found $($archives.Count)" }
          $zipPath = $archives[0].FullName
          $setups = @(Get-ChildItem 'installer_output/FolderLens_Setup_*.exe')
          if ($setups.Count -ne 1) { throw "Expected one installer, found $($setups.Count)" }
          python release_manifest.py 'dist/FolderLens.exe' $zipPath $setups[0].FullName --output SHA256SUMS
          Get-Content SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FolderLens-windows
          path: |
            dist/FolderLens.exe
            FolderLens-*-win64.zip
            SHA256SUMS
            installer_output/FolderLens_Setup_*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/FolderLens.exe
            FolderLens-*-win64.zip
            SHA256SUMS
            installer_output/FolderLens_Setup_*.exe
          generate_release_notes: true
